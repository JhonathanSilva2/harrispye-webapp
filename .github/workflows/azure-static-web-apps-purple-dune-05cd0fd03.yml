# https://learn.microsoft.com/en-us/azure/static-web-apps/deploy-nextjs-hybrid
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    environment: Production
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set progress false
          npm install @actions/core@1.6.0 @actions/http-client --loglevel verbose --prefer-offline --no-audit --no-fund
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
          
      - name: Build And Deploy
        env:
          # --- Este é o bloco de segredos corrigido ---
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          APPLICATIONINSIGHTSAGENT_EXTENSION_VERSION: ${{ secrets.APPLICATIONINSIGHTSAGENT_EXTENSION_VERSION }}
          AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
          AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          CI: ${{ secrets.CI }}
          COMPANY_ACRONYM: ${{ secrets.COMPANY_ACRONYM }}
          DATABASE_URL_HPBASE: ${{ secrets.DATABASE_URL_HPBASE }}
          DATABASE_URL_PROPOSALS: ${{ secrets.DATABASE_URL_PROPOSALS }}
          DEVELOPMENT_BRAZIL_EMAIL: ${{ secrets.DEVELOPMENT_BRAZIL_EMAIL }}
          GENERATE_SOURCEMAP: ${{ secrets.GENERATE_SOURCEMAP }}
          NEXT_PUBLIC_AZURE_STORAGE_URL: ${{ secrets.NEXT_PUBLIC_AZURE_STORAGE_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_MAINTENANCE_MODE: ${{ secrets.NEXT_PUBLIC_MAINTENANCE_MODE }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NOREPLY_EMAIL: ${{ secrets.NOREPLY_EMAIL }}
          NOREPLY_HOST: ${{ secrets.NOREPLY_HOST }}
          NOREPLY_PASSWORD: ${{ secrets.NOREPLY_PASSWORD }}
          NOREPLY_PORT: ${{ secrets.NOREPLY_PORT }}
          PROJECTS_BRAZIL_EMAIL: ${{ secrets.PROJECTS_BRAZIL_EMAIL }}
          SALT_ROUNDS: ${{ secrets.SALT_ROUNDS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          STORAGE_PATH: ${{ secrets.STORAGE_PATH }}
          # --- Fim do bloco de segredos ---

        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_05CD0FD03 }}
          action: "upload"
          app_build_command: "npm ci && npm run build"
          app_location: "/" # App source code path
          api_build_command: >
            rm -rf $SOURCE_DIR/node_modules/@next/swc-* &&
            rm -rf $SOURCE_DIR/.next/cache
          output_location: "" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_DUNE_05CD0FD03 }}
